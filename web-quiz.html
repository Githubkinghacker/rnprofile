<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Space Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .quiz-container {
            background: rgba(10, 20, 40, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.3);
            width: 85%;
            max-width: 700px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(100, 200, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .question {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            padding: 1.2rem;
            background: rgba(20, 40, 80, 0.7);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .option-btn:hover {
            background: rgba(100, 200, 255, 0.2);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
            transform: translateY(-2px);
        }

        .score {
            text-align: center;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 1.5rem;
        }

        .progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #64f38c, #00f2fe);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .category {
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 0.5rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    <div class="quiz-container">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="progress">
            <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
        </div>
        <div class="category" id="category"></div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
    </div>

    <script>
        // Enhanced Starfield Animation
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numberOfStars = 800;
        const shootingStarInterval = 2000;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() {
                this.reset();
                this.hue = Math.random() * 60 + 180;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * 2500;
                this.radius = Math.random() * 1.5;
                this.velocity = Math.random() * 0.04 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.z -= this.velocity * (1 + this.radius/3);
                this.alpha = 0.5 + Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.3;
                if (this.z <= 0) this.reset();
            }

            draw() {
                const x = (this.x - canvas.width/2) * (2500 / this.z) + canvas.width/2;
                const y = (this.y - canvas.height/2) * (2500 / this.z) + canvas.height/2;
                const radius = this.radius * (2500 / this.z);
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${this.alpha})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                
                ctx.beginPath();
                ctx.arc(x, y, radius * 3, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 100%, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < numberOfStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        function createShootingStar() {
            const hue = Math.random() * 60 + 180;
            const shootingStar = {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: 250 + Math.random() * 150,
                angle: Math.random() * Math.PI * 2,
                speed: 12 + Math.random() * 10,
                life: 1,
                hue: hue
            };

            const drawShootingStar = () => {
                shootingStar.x += Math.cos(shootingStar.angle) * shootingStar.speed;
                shootingStar.y += Math.sin(shootingStar.angle) * shootingStar.speed;
                shootingStar.life -= 0.008;

                const gradient = ctx.createLinearGradient(
                    shootingStar.x, 
                    shootingStar.y,
                    shootingStar.x - Math.cos(shootingStar.angle) * shootingStar.length,
                    shootingStar.y - Math.sin(shootingStar.angle) * shootingStar.length
                );
                gradient.addColorStop(0, `hsla(${shootingStar.hue}, 100%, 90%, ${shootingStar.life})`);
                gradient.addColorStop(1, `hsla(${shootingStar.hue}, 100%, 50%, 0)`);
                
                ctx.beginPath();
                ctx.moveTo(shootingStar.x, shootingStar.y);
                ctx.lineTo(
                    shootingStar.x - Math.cos(shootingStar.angle) * shootingStar.length,
                    shootingStar.y - Math.sin(shootingStar.angle) * shootingStar.length
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 5 * shootingStar.life;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(shootingStar.x, shootingStar.y, 3 * shootingStar.life, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${shootingStar.hue}, 100%, 100%, ${shootingStar.life})`;
                ctx.fill();

                if (shootingStar.life > 0) {
                    requestAnimationFrame(drawShootingStar);
                }
            };

            drawShootingStar();
        }

        setInterval(() => {
            if(Math.random() > 0.5) createShootingStar();
        }, shootingStarInterval);

        // Web Development Quiz Questions (5 Front-end, 5 Back-end)
        const questions = [
            // Front-end Questions
            {
                category: "Front-end",
                question: "Which CSS property controls the space between elements?",
                options: ["margin", "padding", "border", "spacing"],
                correct: 0,
                explanation: "The margin property controls the space outside and between elements."
            },
            {
                category: "Front-end",
                question: "What does the 'DOM' stand for in web development?",
                options: ["Data Object Model", "Document Object Model", "Display Object Management", "Digital Output Module"],
                correct: 1,
                explanation: "DOM stands for Document Object Model, representing the structure of web documents."
            },
            {
                category: "Front-end",
                question: "Which JavaScript framework is developed by Google?",
                options: ["React", "Vue", "Angular", "Svelte"],
                correct: 2,
                explanation: "Angular is developed and maintained by Google."
            },
            {
                category: "Front-end",
                question: "What does 'ES6' refer to in JavaScript?",
                options: ["A JavaScript framework", "A version of JavaScript", "A testing library", "A CSS preprocessor"],
                correct: 1,
                explanation: "ES6 (ECMAScript 2015) was a major update to JavaScript introducing many new features."
            },
            {
                category: "Front-end",
                question: "Which HTML5 element is used for drawing graphics?",
                options: ["<graphic>", "<canvas>", "<draw>", "<svg>"],
                correct: 1,
                explanation: "The <canvas> element is used to draw graphics via JavaScript."
            },
            
            // Back-end Questions
            {
                category: "Back-end",
                question: "Which protocol is primarily used for REST APIs?",
                options: ["FTP", "HTTP", "SMTP", "TCP"],
                correct: 1,
                explanation: "REST APIs typically use HTTP/HTTPS as their communication protocol."
            },
            {
                category: "Back-end",
                question: "What is the purpose of Node.js?",
                options: ["Front-end development", "Back-end JavaScript runtime", "Database management", "CSS preprocessing"],
                correct: 1,
                explanation: "Node.js allows JavaScript to be used for server-side/back-end development."
            },
            {
                category: "Back-end",
                question: "Which database is document-oriented?",
                options: ["MySQL", "MongoDB", "PostgreSQL", "SQLite"],
                correct: 1,
                explanation: "MongoDB is a popular NoSQL document database."
            },
            {
                category: "Back-end",
                question: "What does 'CRUD' stand for in web development?",
                options: ["Create, Read, Update, Delete", "Copy, Replace, Update, Delete", "Cache, Read, Update, Deploy", "Compile, Run, Update, Debug"],
                correct: 0,
                explanation: "CRUD represents the four basic operations of persistent storage."
            },
            {
                category: "Back-end",
                question: "Which tool is used for version control in web development?",
                options: ["Git", "NPM", "Webpack", "Docker"],
                correct: 0,
                explanation: "Git is the most widely used version control system."
            }
        ];

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const scoreElement = document.getElementById("score");
        const progressBar = document.getElementById("progress-bar");
        const categoryElement = document.getElementById("category");

        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {
            updateProgress();
            const question = questions[currentQuestion];
            questionElement.textContent = question.question;
            categoryElement.textContent = question.category;
            optionsElement.innerHTML = "";
            
            question.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.textContent = option;
                button.addEventListener("click", () => selectAnswer(index));
                optionsElement.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestion];
            const options = document.querySelectorAll(".option-btn");
            
            options.forEach(option => option.disabled = true);
            
            if (selectedIndex === question.correct) {
                score++;
                scoreElement.textContent = score;
                Swal.fire({
                    icon: 'success',
                    title: 'Correct!',
                    html: `<p>${question.explanation}</p>`,
                    confirmButtonColor: '#64f38c',
                    background: 'rgba(10, 20, 40, 0.9)',
                    iconColor: '#00b894',
                    timer: 5000,
                    timerProgressBar: true
                }).then(() => nextQuestion());
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Wrong!',
                    html: `<p>Correct: <strong>${question.options[question.correct]}</strong></p>
                           <p>${question.explanation}</p>`,
                    confirmButtonColor: '#ff7675',
                    background: 'rgba(10, 20, 40, 0.9)',
                    iconColor: '#d63031',
                    timer: 5000,
                    timerProgressBar: true
                }).then(() => nextQuestion());
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            Swal.fire({
                title: 'Quiz Completed!',
                html: `Final Score: <strong>${score}/${questions.length}</strong>`,
                icon: 'info',
                confirmButtonColor: '#64f38c',
                background: 'rgba(10, 20, 40, 0.9)',
                iconColor: '#00b894',
                timer: 5000,
                timerProgressBar: true
            }).then(() => {
                currentQuestion = 0;
                score = 0;
                scoreElement.textContent = score;
                progressBar.style.width = '0%';
                showQuestion();
            });
        }

        // Start quiz
        showQuestion();
    </script>
</body>
</html>
