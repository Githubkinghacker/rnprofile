<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .portal-container {
            background: rgba(0, 0, 30, 0.9);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 191, 255, 0.3);
            width: 85%;
            max-width: 700px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0, 191, 255, 0.5);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
            margin-bottom: 2rem;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .quiz-btn {
            padding: 1.5rem;
            background: rgba(0, 0, 50, 0.7);
            border: 1px solid rgba(0, 191, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-btn:hover {
            background: rgba(0, 191, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.4);
            transform: translateY(-5px);
        }

        .web-btn {
            border-color: rgba(0, 255, 191, 0.5);
        }
        .web-btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 191, 0.4);
        }

        .cyber-btn {
            border-color: rgba(255, 100, 100, 0.5);
        }
        .cyber-btn:hover {
            box-shadow: 0 0 20px rgba(255, 100, 100, 0.4);
        }

        .prog-btn {
            border-color: rgba(100, 100, 255, 0.5);
        }
        .prog-btn:hover {
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.4);
        }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    <div class="portal-container">
        <h1>Choose Your Quiz</h1>
        <div class="quiz-options">
            <button class="quiz-btn web-btn" id="web-btn">Web Technology</button>
            <button class="quiz-btn cyber-btn" id="cyber-btn">Cybersecurity</button>
            <button class="quiz-btn prog-btn" id="prog-btn">Programming</button>
        </div>
    </div>

    <script>
        // Realistic Starfield Animation
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numberOfStars = 800;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() {
                this.reset();
                this.hue = Math.random() * 60 + 200;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * 2500;
                this.radius = Math.random() * 1.2;
                this.velocity = Math.random() * 0.02 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.z -= this.velocity * (1 + this.radius/3);
                this.alpha = 0.5 + Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.3;
                if (this.z <= 0) this.reset();
            }

            draw() {
                const x = (this.x - canvas.width/2) * (2500 / this.z) + canvas.width/2;
                const y = (this.y - canvas.height/2) * (2500 / this.z) + canvas.height/2;
                const radius = this.radius * (2500 / this.z);
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, ${70 + (this.z/2500)*30}%, ${this.alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < numberOfStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Quiz Navigation
        document.getElementById('web-btn').addEventListener('click', () => {
            window.location.href = 'web-quiz.html';
        });

        document.getElementById('cyber-btn').addEventListener('click', () => {
            window.location.href = 'cyber-quiz.html';
        });

        document.getElementById('prog-btn').addEventListener('click', () => {
            window.location.href = 'prog-quiz.html';
        });

        // Create shooting stars occasionally
        setInterval(() => {
            if(Math.random() > 0.7) {
                const shootingStar = {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: 200 + Math.random() * 100,
                    angle: Math.random() * Math.PI * 2,
                    speed: 10 + Math.random() * 8,
                    life: 1,
                    hue: Math.random() * 60 + 200
                };

                const drawShootingStar = () => {
                    shootingStar.x += Math.cos(shootingStar.angle) * shootingStar.speed;
                    shootingStar.y += Math.sin(shootingStar.angle) * shootingStar.speed;
                    shootingStar.life -= 0.01;

                    ctx.beginPath();
                    ctx.moveTo(shootingStar.x, shootingStar.y);
                    ctx.lineTo(
                        shootingStar.x - Math.cos(shootingStar.angle) * shootingStar.length,
                        shootingStar.y - Math.sin(shootingStar.angle) * shootingStar.length
                    );
                    ctx.strokeStyle = `hsla(${shootingStar.hue}, 90%, 80%, ${shootingStar.life})`;
                    ctx.lineWidth = 4 * shootingStar.life;
                    ctx.stroke();

                    if (shootingStar.life > 0) {
                        requestAnimationFrame(drawShootingStar);
                    }
                };

                drawShootingStar();
            }
        }, 2000);
    </script>
</body>
</html>
